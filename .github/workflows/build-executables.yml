name: Build Traffic Simulator

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pillow pyinstaller pyinstaller-hooks-contrib
          python -m pip check

      - name: Generate app icons
        run: python scripts/generate_icons.py

      - name: Clean old builds
        shell: powershell
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path "Traffic Simulator") { Remove-Item "Traffic Simulator" -Recurse -Force }

      - name: Build Windows executable
        run: >
          pyinstaller --onefile --windowed
          --add-data "assets;assets"
          --add-data "models;models"
          --icon=assets/app_icon.ico
          --name TrafficSimulator
          src/main.py

      - name: Assemble Windows bundle
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "Traffic Simulator" | Out-Null
          Copy-Item dist\TrafficSimulator.exe "Traffic Simulator\"
          Copy-Item README.md "Traffic Simulator\"
          Copy-Item requirements.txt "Traffic Simulator\"
          Copy-Item models "Traffic Simulator\traffic_simulator models" -Recurse
          @"
          Traffic Simulator (Windows)
          ---------------------------
          1) Double-click TrafficSimulator.exe
          2) If SmartScreen warns, click More info -> Run anyway.
          3) All required runtime dependencies, assets, and bundled models are included in the executable package.
          4) User-editable models are in: traffic_simulator models
          "@ | Set-Content "Traffic Simulator\RUN_ME_FIRST.txt"

      - name: Zip Windows package
        run: Compress-Archive "Traffic Simulator" TrafficSimulator-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSimulator-Windows
          path: TrafficSimulator-Windows.zip

      - name: Upload Windows to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TrafficSimulator-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pillow pyinstaller pyinstaller-hooks-contrib
          python -m pip check

      - name: Generate app icons
        run: python scripts/generate_icons.py

      - name: Clean old builds
        run: |
          rm -rf build
          rm -rf dist
          rm -rf "Traffic Simulator"

      - name: Build macOS app
        run: >
          pyinstaller --onefile --windowed
          --icon=assets/app_icon.icns
          --add-data "assets:assets"
          --add-data "models:models"
          --name TrafficSimulator
          src/main.py

      - name: Assemble macOS bundle
        run: |
          mkdir "Traffic Simulator"
          if [ -d "dist/TrafficSimulator.app" ]; then
            cp -R dist/TrafficSimulator.app "Traffic Simulator/"
          elif [ -f "dist/TrafficSimulator" ]; then
            cp dist/TrafficSimulator "Traffic Simulator/"
          else
            echo "No macOS build output found in dist/"
            ls -la dist
            exit 1
          fi
          cp README.md "Traffic Simulator/"
          cp requirements.txt "Traffic Simulator/"
          cp -R models "Traffic Simulator/traffic_simulator models"
          cat > "Traffic Simulator/RUN_ME_FIRST.txt" << 'EOF'
          Traffic Simulator (macOS)
          -------------------------
          1) Open TrafficSimulator.app (or TrafficSimulator binary if provided).
          2) If Gatekeeper blocks launch, right-click -> Open the first time.
          3) All required runtime dependencies, assets, and bundled models are included in the executable package.
          4) User-editable models are in: traffic_simulator models
          EOF

      - name: Zip macOS package
        run: |
          zip -r TrafficSimulator-macOS.zip "Traffic Simulator"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSimulator-macOS
          path: TrafficSimulator-macOS.zip

      - name: Upload macOS to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TrafficSimulator-macOS.zip

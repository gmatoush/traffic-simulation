name: Build Traffic Simulator

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pillow pyinstaller

      - name: Generate app icons
        run: python scripts/generate_icons.py

      - name: Clean old builds
        shell: powershell
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path package) { Remove-Item package -Recurse -Force }

      - name: Build Windows executable
        run: >
          pyinstaller --onefile --windowed
          --add-data "assets;assets"
          --icon=assets/app_icon.ico
          --name TrafficSimulator
          src/main.py

      - name: Create Windows shortcut
        shell: powershell
        run: |
          mkdir package
          Copy-Item dist\TrafficSimulator.exe package\
          Copy-Item assets package\assets -Recurse
          $WshShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("package\Traffic Simulator.lnk")
          $Shortcut.TargetPath = "$PWD\package\TrafficSimulator.exe"
          $Shortcut.WorkingDirectory = "$PWD\package"
          $Shortcut.IconLocation = "$PWD\package\TrafficSimulator.exe"
          $Shortcut.Save()

      - name: Zip Windows package
        run: Compress-Archive package TrafficSimulator-Windows.zip

      - name: Upload Windows to Release
        uses: softprops/action-gh-release@v2
        with:
          files: TrafficSimulator-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pillow pyinstaller

      - name: Generate app icons
        run: python scripts/generate_icons.py

      - name: Clean old builds
        run: |
          rm -rf build
          rm -rf dist
          rm -rf package

      - name: Build macOS app
        run: >
          pyinstaller --windowed
          --icon=assets/app_icon.icns
          --add-data "assets:assets"
          --name TrafficSimulator
          src/main.py

      - name: Create macOS alias
        run: |
          mkdir package
          cp -R dist/TrafficSimulator.app package/
          ln -s TrafficSimulator.app package/Traffic\ Simulator

      - name: Zip macOS package
        run: |
          cd package
          zip -r ../TrafficSimulator-macOS.zip .

      - name: Upload macOS to Release
        uses: softprops/action-gh-release@v2
        with:
          files: TrafficSimulator-macOS.zip

name: Build Traffic Simulator

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pillow pyinstaller

      - name: Generate app icons
        run: python scripts/generate_icons.py

      - name: Clean old builds
        shell: powershell
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path package) { Remove-Item package -Recurse -Force }

      - name: Build Windows executable
        run: >
          pyinstaller --onefile --windowed
          --add-data "assets;assets"
          --add-data "models;models"
          --icon=assets/app_icon.ico
          --name TrafficSimulator
          src/main.py

      - name: Package Windows build
        shell: powershell
        run: |
          mkdir package
          Copy-Item dist\TrafficSimulator.exe package\

      - name: Zip Windows package
        run: Compress-Archive package TrafficSimulator-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSimulator-Windows
          path: TrafficSimulator-Windows.zip

      - name: Upload Windows to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TrafficSimulator-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pillow pyinstaller

      - name: Generate app icons
        run: python scripts/generate_icons.py

      - name: Clean old builds
        run: |
          rm -rf build
          rm -rf dist
          rm -rf package

      - name: Build macOS app
        run: >
          pyinstaller --onefile --windowed
          --icon=assets/app_icon.icns
          --add-data "assets:assets"
          --add-data "models:models"
          --name TrafficSimulator
          src/main.py

      - name: Package macOS build
        run: |
          mkdir package
          if [ -d "dist/TrafficSimulator.app" ]; then
            cp -R dist/TrafficSimulator.app package/
          elif [ -f "dist/TrafficSimulator" ]; then
            cp dist/TrafficSimulator package/
          else
            echo "No macOS build output found in dist/"
            ls -la dist
            exit 1
          fi

      - name: Zip macOS package
        run: |
          cd package
          zip -r ../TrafficSimulator-macOS.zip .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSimulator-macOS
          path: TrafficSimulator-macOS.zip

      - name: Upload macOS to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TrafficSimulator-macOS.zip
